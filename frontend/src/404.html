<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AeroWMS | Redirecting...</title>
  <script>
    // GitHub Pages SPA Routing Support:
    // Redirects deep links (e.g., /WMS-SYSTEM/login) to HashLocation (e.g., /WMS-SYSTEM/#/login)
    var path = window.location.pathname;
    var base = '/WMS-SYSTEM/';
    if (path.startsWith(base)) {
      var route = path.slice(base.length);
      window.location.replace(base + '#/' + route + window.location.search + window.location.hash);
    } else {
      window.location.replace(base);
    }
  </script>
</head>
<body style="background-color: #0b0f19; color: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
  <p>Loading AeroWMS Platform...</p>
</body>
</html>
